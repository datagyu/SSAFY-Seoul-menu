<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>싸밥서울</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260826-1">
<meta name="theme-color" content="#F7F5EF">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260811-2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="싸밥서울">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<link rel="stylesheet" href="./assets/app.css?v=20261018-5">
<script src="./themes/seasonal.js?v=20261018"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span>싸밥서울</span></div>
    <div class="mini-nav"><span class="campus-label">SSAFY 서울캠</span><a class="info-link" href="https://app.notion.com/p/3baf2e21a8d58184808cc1b0fef38ff6?source=copy_link" target="_blank" rel="noopener noreferrer" aria-label="싸밥서울 소개">ⓘ</a></div>
  </div>

  <section class="hero">
    <div class="hero-copy">
      <div class="hero-mobile-content">
        <div class="hero-text">
          <h1>오늘의 식단을<br><strong>한 눈에</strong> 확인하세요.</h1>
          <p class="subtitle">원하는 날짜를 선택해 20층과 10층의 메뉴를 확인하세요.</p>
        </div>
        <img src="./character.png" class="hero-mobile-character" alt="" aria-hidden="true">
      </div>
    </div>
    <aside class="today-card" aria-label="오늘의 한마디">
      <div class="today-content">
        <span class="today-badge">SSAFY 파이팅</span>
        <h2>오늘도 맛있는 점심과 함께 행복한 SSAFY 생활 되세요!</h2>
      </div>
      <img src="./character.png" class="today-character" alt="" aria-hidden="true">
    </aside>
  </section>

  <div class="date-controls">
    <div class="date-navigator">
      <button class="nav-arrow" id="prevWeek" aria-label="이전 주"><span aria-hidden="true">‹</span></button>
      <div class="date-center">
        <strong id="weekRange">날짜 불러오는 중...</strong>
        <button class="calendar-button" id="calendarButton" type="button" aria-expanded="false" aria-controls="calendarPanel" aria-label="캘린더 열기" title="날짜 선택"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></button>
        <button class="week-view-button" id="weekViewButton" type="button">주간 메뉴</button>
        <div id="calendarPanel" class="calendar-panel hidden" aria-label="날짜 선택 캘린더"></div>
      </div>
      <button class="nav-arrow" id="nextWeek" aria-label="다음 주"><span aria-hidden="true">›</span></button>
      <div class="mobile-date-bar" id="mobileDateBar" aria-label="날짜 선택"></div>
    </div>

  </div>

  <main class="week-grid" id="weekGrid"></main>
  <div class="notice"> 식단은 식자재 수급과 운영 상황에 따라 변경될 수 있습니다. 알레르기·원산지 정보는 원본 식단표에서 확인해 주세요.</div>
  <div class="footer"><p><b>싸밥서울</b> · SSAFY 서울캠퍼스 주간 식단</p><p>본 페이지는 SSAFY 서울캠퍼스 구성원의 편의를 위해 식단 정보를 재구성한 비공식 페이지이며 SSAFY 공식 서비스가 아닙니다.</p></div>
</div>
<script>
const grid=document.getElementById('weekGrid');
const weekRange=document.getElementById('weekRange');
const mobileDateBar=document.getElementById('mobileDateBar');
const calendarButton=document.getElementById('calendarButton');
const calendarPanel=document.getElementById('calendarPanel');
const weekViewButton=document.getElementById('weekViewButton');

const mobileMedia=window.matchMedia('(max-width: 900px)');
const prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const dayCache=new Map();
const pendingDays=new Map();
const LOCAL_DATA_BASE='./data/';
const weekdays=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const shortWeekdays=['일','월','화','수','목','금','토'];
const englishWeekdays=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const calendarHeads=['일','월','화','수','목','금','토'];

let calendarMonth;
let currentMonday;
let selectedDate;
let currentFloor='all';
let desktopWeekView=false;
let isSwipeAnimating=false;
let renderSequence=0;
let swipeStartX=0;
let swipeStartY=0;

const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{
  const [y,m,d]=String(k).split('-').map(Number);
  return new Date(y,m-1,d,12);
};
const todayKey=()=>key(new Date());

function mondayOf(d){
  const x=new Date(d);
  const day=x.getDay();
  x.setDate(x.getDate()+(day===0?-6:1-day));
  x.setHours(12,0,0,0);
  return x;
}
function addDays(d,n){
  const x=new Date(d);
  x.setDate(x.getDate()+n);
  return x;
}
function escapeHTML(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
function floorMenus(day,floor){
  const menus=day?.floors?.[floor];
  return Array.isArray(menus)?menus:[];
}
function normalizeMenu(menu){
  if(!Array.isArray(menu))return {name:'',type:'',items:[]};
  const [name='',type='',items=[]]=menu;
  return {name:name??'',type:type??'',items:Array.isArray(items)?items:[]};
}
function dateMeta(k){
  const d=parseKey(k);
  return {
    date:k,
    dateLabel:`${d.getMonth()+1}월 ${d.getDate()}일`,
    weekdayLabel:`${weekdays[d.getDay()]} · ${englishWeekdays[d.getDay()]}`
  };
}

async function fetchJSON(url){
  try{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)return null;
    const data=await response.json();
    return data&&typeof data==='object'?data:null;
  }catch{
    return null;
  }
}

async function fetchDay(k){
  const localData=await fetchJSON(`${LOCAL_DATA_BASE}${k}.json`);
  if(!localData)return null;

  const floor20=floorMenus(localData,'20');
  const floor10=floorMenus(localData,'10');
  if(!floor20.length&&!floor10.length)return null;

  return {
    ...dateMeta(k),
    ...localData,
    floors:{'20':floor20,'10':floor10}
  };
}

function loadDay(k){
  if(dayCache.has(k))return Promise.resolve(dayCache.get(k));
  if(pendingDays.has(k))return pendingDays.get(k);

  const request=fetchDay(k)
    .then(day=>{
      // null도 캐시해 같은 미등록 날짜를 반복 요청하지 않는다.
      dayCache.set(k,day);
      return day;
    })
    .finally(()=>pendingDays.delete(k));

  pendingDays.set(k,request);
  return request;
}

function box(menu){
  const {name,type,items}=normalizeMenu(menu);
  const safeType=escapeHTML(type);
  const typeHTML=safeType?`<span class="type" data-type="${safeType}">${safeType}</span>`:'';
  const itemHTML=items.map(item=>`<li>${escapeHTML(item)}</li>`).join('');
  return `<div class="menu-box"><p class="menu-name"><span class="menu-title">${escapeHTML(name)}</span>${typeHTML}</p><ul class="items">${itemHTML}</ul></div>`;
}

function dayHeadHTML(dateKey,dateLabel,weekdayLabel,isToday,extra='',showChip=true){
  let chip='';
  if(showChip){
    const d=parseKey(dateKey);
    chip=`<div class="date-chip ${isToday?'is-today':''}"><span class="chip-num">${d.getDate()}</span><span class="chip-mon">${d.getMonth()+1}월</span></div>`;
  }
  return `<div class="day-head">${chip}<div class="day-head-copy"><span class="date">${escapeHTML(dateLabel)}</span><span class="weekday">${escapeHTML(weekdayLabel)}</span></div>${extra}</div>`;
}

function floorSectionHTML(day,floor){
  const menus=floorMenus(day,floor);
  const content=menus.length
    ? menus.map(menu=>box(menu)).join('')
    : '<div class="floor-empty">등록된 식단 정보가 없습니다.</div>';
  return `<section class="floor-section floor-${floor}" data-floor="${floor}"><div class="floor-title"><h2>${floor}층</h2><span class="floor-badge">${menus.length}가지 메뉴</span></div><div class="menu-list">${content}</div></section>`;
}

function card(d,single=true){
  const floorButtons=single
    ? '<div class="floor-buttons" aria-label="층 필터">'+['all','20','10'].map(floor=>`<button class="floor-btn ${currentFloor===floor?'active':''}" data-floor="${floor}" aria-pressed="${currentFloor===floor}">${floor==='all'?'전체':floor+'층'}</button>`).join('')+'</div>'
    : '';
  const isToday=d?.date===todayKey();
  const cardClass=dayCardClass(single,isToday);
  return `<article class="${cardClass}" data-date="${escapeHTML(d?.date)}">${dayHeadHTML(d?.date,d?.dateLabel,d?.weekdayLabel,isToday,floorButtons,!single)}<div class="day-layout">${['20','10'].map(floor=>floorSectionHTML(d,floor)).join('')}</div></article>`;
}

function dayCardClass(single,isToday){
  return `day-card${single?' single-date-card':''}${!single&&isToday?' today-week-card':''}`;
}

function applyFloor(root=document){
  root.querySelectorAll('.floor-btn').forEach(button=>{
    const active=button.dataset.floor===currentFloor;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  const singleFloor=currentFloor!=='all';
  root.querySelectorAll('.floor-section').forEach(section=>{
    section.classList.toggle('hidden',singleFloor&&section.dataset.floor!==currentFloor);
  });
  root.querySelectorAll('.day-layout').forEach(layout=>{
    layout.classList.toggle('single-floor',singleFloor);
  });
}

function renderDateBar(){
  const today=todayKey();
  const startDate=mobileMedia.matches?addDays(parseKey(selectedDate),-2):currentMonday;
  let html='';

  for(let i=0;i<5;i++){
    const d=addDays(startDate,i);
    const dateKey=key(d);
    const active=(mobileMedia.matches||!desktopWeekView)&&dateKey===selectedDate;
    html+=`<button class="mobile-day ${active?'active':''} ${dateKey===today?'today':''}" data-date="${dateKey}" aria-pressed="${active}"><span class="num">${d.getDate()}</span><span>${shortWeekdays[d.getDay()]}</span></button>`;
  }
  mobileDateBar.innerHTML=html;
}

mobileDateBar.addEventListener('click',event=>{
  const button=event.target.closest('.mobile-day');
  if(!button)return;
  selectDay(button.dataset.date);
});

function updateSelectedDate(){
  const selected=parseKey(selectedDate);
  weekRange.textContent=`${selected.getFullYear()}년 ${selected.getMonth()+1}월 ${selected.getDate()}일 ${weekdays[selected.getDay()]}`;
  calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1,12);
  renderDateBar();
}

function emptyDayCard(dateKey,single=true){
  const meta=dateMeta(dateKey);
  const isToday=dateKey===todayKey();
  const cardClass=dayCardClass(single,isToday);
  return `<article class="${cardClass}" data-date="${dateKey}">${dayHeadHTML(dateKey,meta.dateLabel,meta.weekdayLabel,isToday,'',!single)}<div class="empty-menu-panel">등록된 식단 정보가 없습니다.</div></article>`;
}

function showSingleDay(d){
  updateSelectedDate();
  weekViewButton.classList.remove('active');
  grid.innerHTML=d?card(d):emptyDayCard(selectedDate);
  grid.classList.remove('week-view');
  applyFloor();
}

async function moveSelectedDay(direction){
  if(isSwipeAnimating)return;

  const selected=parseKey(selectedDate);
  const nextDate=key(addDays(selected,direction));
  const swipeSequence=renderSequence;
  const swipeStartDate=selectedDate;
  isSwipeAnimating=true;

  try{
    const nextDay=await loadDay(nextDate);
    if(!mobileMedia.matches||swipeSequence!==renderSequence||selectedDate!==swipeStartDate)return;

    if(prefersReducedMotion.matches){
      selectedDate=nextDate;
      currentMonday=mondayOf(parseKey(nextDate));
      showSingleDay(nextDay);
      return;
    }

    const outgoing=grid.firstElementChild;
    if(!outgoing)return;

    const template=document.createElement('template');
    template.innerHTML=nextDay?card(nextDay):emptyDayCard(nextDate);
    const incoming=template.content.firstElementChild;
    applyFloor(incoming);

    incoming.classList.add('swipe-incoming');
    grid.classList.add('is-swiping');
    grid.appendChild(incoming);

    const travel=direction>0?-100:100;
    const options={duration:300,easing:'cubic-bezier(.22,.61,.36,1)',fill:'forwards'};
    const outgoingAnimation=outgoing.animate([
      {transform:'translate3d(0,0,0)'},
      {transform:`translate3d(${travel}%,0,0)`}
    ],options);
    const incomingAnimation=incoming.animate([
      {transform:`translate3d(${-travel}%,0,0)`},
      {transform:'translate3d(0,0,0)'}
    ],options);

    await Promise.all([
      outgoingAnimation.finished.catch(()=>{}),
      incomingAnimation.finished.catch(()=>{})
    ]);

    if(!mobileMedia.matches||swipeSequence!==renderSequence||selectedDate!==swipeStartDate){
      incoming.remove();
      return;
    }

    incoming.classList.remove('swipe-incoming');
    grid.replaceChildren(incoming);
    selectedDate=nextDate;
    currentMonday=mondayOf(parseKey(nextDate));
    updateSelectedDate();
  }finally{
    grid.classList.remove('is-swiping');
    isSwipeAnimating=false;
  }
}

grid.addEventListener('touchstart',event=>{
  if(!mobileMedia.matches||event.touches.length!==1)return;
  swipeStartX=event.touches[0].clientX;
  swipeStartY=event.touches[0].clientY;
},{passive:true});

grid.addEventListener('touchend',event=>{
  if(!mobileMedia.matches||event.changedTouches.length!==1)return;
  const deltaX=event.changedTouches[0].clientX-swipeStartX;
  const deltaY=event.changedTouches[0].clientY-swipeStartY;
  if(Math.abs(deltaX)<50||Math.abs(deltaX)<=Math.abs(deltaY)*1.25)return;
  moveSelectedDay(deltaX<0?1:-1);
},{passive:true});

async function render(){
  const sequence=++renderSequence;

  if(desktopWeekView&&!mobileMedia.matches){
    weekViewButton.classList.add('active');
    const monday=new Date(currentMonday);
    const dates=Array.from({length:5},(_,i)=>addDays(monday,i));
    const friday=dates[4];
    weekRange.textContent=`${monday.getFullYear()}년 ${monday.getMonth()+1}월 ${monday.getDate()}일 ~ ${friday.getMonth()+1}월 ${friday.getDate()}일`;
    renderDateBar();

    const days=await Promise.all(dates.map(date=>loadDay(key(date))));
    if(sequence!==renderSequence)return;

    grid.innerHTML=days.map((day,i)=>day?card(day,false):emptyDayCard(key(dates[i]),false)).join('');
    grid.classList.add('week-view');
    applyFloor();
    return;
  }

  const requestedDate=selectedDate;
  const day=await loadDay(requestedDate);
  if(sequence!==renderSequence||requestedDate!==selectedDate)return;
  showSingleDay(day);
}

function init(){
  const today=new Date();
  selectedDate=key(today);
  currentMonday=mondayOf(today);
  desktopWeekView=!mobileMedia.matches;
  render();
}

function selectDay(date){
  selectedDate=date;
  currentMonday=mondayOf(parseKey(date));
  desktopWeekView=false;
  return render();
}

function moveWeek(direction){
  const date=addDays(parseKey(selectedDate),direction*7);
  selectedDate=key(date);
  currentMonday=mondayOf(date);
  return render();
}

document.getElementById('prevWeek').addEventListener('click',()=>moveWeek(-1));
document.getElementById('nextWeek').addEventListener('click',()=>moveWeek(1));

weekViewButton.addEventListener('click',()=>{
  desktopWeekView=true;
  currentFloor='all';
  currentMonday=mondayOf(parseKey(selectedDate));
  render();
});

function renderCalendar(){
  const y=calendarMonth.getFullYear();
  const m=calendarMonth.getMonth();
  const first=new Date(y,m,1,12);
  const last=new Date(y,m+1,0,12);
  const today=todayKey();

  let html=`<div class="calendar-head"><button type="button" data-cal-action="prev" aria-label="이전 달">‹</button><div class="calendar-month-center"><span>${y}년 ${m+1}월</span><button type="button" class="calendar-today-icon" data-cal-action="today" aria-label="오늘로 이동" title="오늘">↺</button></div><button type="button" data-cal-action="next" aria-label="다음 달">›</button></div><div class="calendar-grid">${calendarHeads.map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}`;

  html+='<div class="calendar-empty"></div>'.repeat(first.getDay());
  for(let day=1;day<=last.getDate();day++){
    const dateKey=key(new Date(y,m,day,12));
    html+=`<button type="button" class="calendar-day ${dateKey===selectedDate?'selected':''} ${dateKey===today?'today':''}" data-date="${dateKey}">${day}</button>`;
  }
  calendarPanel.innerHTML=`${html}</div>`;
}

calendarPanel.addEventListener('click',async event=>{
  event.stopPropagation();
  const action=event.target.closest('[data-cal-action]')?.dataset.calAction;

  if(action==='prev'||action==='next'){
    calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+(action==='prev'?-1:1),1,12);
    renderCalendar();
    return;
  }

  if(action==='today'){
    await selectDay(todayKey());
    renderCalendar();
    return;
  }

  const button=event.target.closest('.calendar-day');
  if(!button)return;
  await selectDay(button.dataset.date);
  renderCalendar();
});

function setCalendarOpen(open){
  if(open){
    const selected=parseKey(selectedDate);
    calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1,12);
    renderCalendar();
  }
  calendarPanel.classList.toggle('hidden',!open);
  calendarButton.setAttribute('aria-expanded',String(open));
}

calendarButton.addEventListener('click',event=>{
  event.stopPropagation();
  setCalendarOpen(calendarPanel.classList.contains('hidden'));
});

document.addEventListener('click',event=>{
  if(!calendarPanel.contains(event.target)&&!calendarButton.contains(event.target))setCalendarOpen(false);
  const button=event.target.closest('.floor-btn');
  if(!button)return;
  currentFloor=button.dataset.floor;
  applyFloor();
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!calendarPanel.classList.contains('hidden')){
    setCalendarOpen(false);
    calendarButton.focus();
  }
});

mobileMedia.addEventListener('change',()=>{
  if(mobileMedia.matches)desktopWeekView=false;
  currentMonday=mondayOf(parseKey(selectedDate));
  render();
});

init();

</script>
</body>
</html>
