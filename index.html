<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>싸밥서울</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260811-2">
<meta name="theme-color" content="#F7F5EF">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260811-2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="싸밥서울">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<style>

*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  min-height:100vh;
  font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;
  color:var(--text);
}
button{
  border:0;
  cursor:pointer;
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:min(1500px,calc(100% - 32px));
  margin:0 auto;
  padding:22px 0 54px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
  margin-bottom:22px;
  top:10px;
  z-index:200;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:950;
  font-size:20px;
  letter-spacing:-.03em;
}
.mini-nav{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:13px;
  font-weight:800;
}
.info-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:inherit;
  text-decoration:none;
  font-size:18px;
  line-height:1;
}

.hero{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);
  gap:22px;
  align-items:stretch;
  margin-bottom:22px;
}

.hero-copy{
  padding:34px 36px;
}
.hero-mobile-content{
  height:100%;
}
.hero-text{
  min-width:0;
}
.hero-mobile-character{
  display:none;
}
.hero h1{
  margin:18px 0 10px;
  font-size:clamp(31px,4vw,54px);
  letter-spacing:-.055em;
  line-height:1.08;
}

.subtitle{
  margin:0;
  max-width:650px;
  font-size:15px;
  line-height:1.7;
}
.today-card{
  padding:25px 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.today-content{
  flex:1;
  min-width:0;
}
.today-badge{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:950;
  letter-spacing:.08em;
}
.today-card h2{
  margin:14px 0 6px;
  font-size:24px;
  letter-spacing:-.04em;
}
.today-character{
  width:clamp(99px,9vw,136px);
  height:auto;
  flex:0 0 auto;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

.date-controls{
  margin-bottom:16px;
}
.date-navigator{
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"prev center next" "days days days";
  align-items:center;
  gap:10px 14px;
  padding:11px 14px 14px;
}
#prevWeek{
  grid-area:prev;
}
#nextWeek{
  grid-area:next;
}
.nav-arrow{
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  font-size:24px;
  display:grid;
  place-items:center;
  line-height:1;
}
.nav-arrow span{
  display:block;
  line-height:1;
  transform:translateY(-1px);
}
.date-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  grid-area:center;
}
.date-center strong{
  font-size:14px;
}
.calendar-button{
  cursor:pointer;
  width:36px;
  height:36px;
  padding:0;
  display:grid;
  place-items:center;
  border-radius:12px;
  font-size:17px;
  line-height:1;
}
.week-view-button{
  height:36px;
  padding:0 14px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.mobile-date-bar{
  display:grid;
  grid-template-columns:repeat(5,minmax(72px,1fr));
  gap:8px;
  grid-area:days;
  width:100%;
  margin:2px auto 0;
  justify-content:center;
}
.mobile-day{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:58px;
  padding:8px 5px;
  font-size:11px;
  font-weight:850;
  position:relative;
  transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.mobile-day .num{
  font-size:16px;
  color:var(--text);
}

.mobile-day.today:after{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
}

.week-grid{
  overflow:visible;
  padding:4px 1px 13px;
}
.day-card{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:23px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
.day-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
}
.day-card.single-date-card{
  overflow:visible;
  background:transparent;
  border:0;
  box-shadow:none;
}
.day-card.single-date-card:hover{
  transform:none;
  box-shadow:none;
}
.day-card.single-date-card .day-head{
  border:1px solid var(--line);
  border-radius:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.day-card.single-date-card .floor-section{
  padding:18px;
}
.day-card.single-date-card .floor-section:first-of-type{
  border-top:1px solid var(--line);
}
.empty-menu-panel{
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  border-radius:22px;
  color:var(--muted);
  font-size:16px;
  font-weight:850;
  text-align:center;
}
.day-card:not(.single-date-card) .empty-menu-panel{
  min-height:180px;
  border:0;
  border-radius:0;
  box-shadow:none;
}

.day-head{
  display:flex;
  align-items:center;
  padding:18px;
  position:relative;
}
.day-head .date{
  display:block;
  font-weight:950;
}
.day-head .weekday{
  display:block;
  font-size:12px;
  font-weight:850;
}
.floor-buttons{
  display:flex;
  flex-direction:row;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
  width:auto;
  height:auto;
  flex:0 0 auto;
  margin-left:auto;
}
.floor-btn{
  width:64px;
  min-width:64px;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  font-size:12px;
  font-weight:850;
  transition:.18s;
}

.day-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:18px;
  align-items:start;
}
.day-layout.single-floor{
  grid-template-columns:minmax(0,min(760px,100%));
  justify-content:center;
}
.floor-section{
  padding:15px;
  border-top:1px dashed #E4DED2;
}
.floor-section:first-of-type{
  border-top:0;
}
.floor-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}
.floor-title h2{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:16px;
}
.floor-title h2:before{
  content:"🍽️";
  font-size:14px;
}
.floor-badge{
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:950;
}

.menu-list{
  display:grid;
  gap:9px;
}
.floor-empty{
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  color:var(--muted);
  font-size:14px;
  font-weight:850;
  text-align:center;
}
.menu-box{
  border:1px solid rgba(124,111,100,.12);
  padding:12px;
}
.menu-box.main20{
  border-left:5px solid var(--floor20);
}
.menu-box.main10{
  border-left:5px solid var(--floor10);
}
.menu-name{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:0 0 10px;
  font-size:14px;
  font-weight:950;
  letter-spacing:-.02em;
}
.type{
  flex:0 0 auto;
  font-size:9px;
  padding:4px 7px;
  border-radius:999px;
}

.items{
  margin:0;
  padding:0;
  list-style:none;
  font-size:12.5px;
  line-height:1.65;
  word-break:keep-all;
}
.items li::before{
  content:"•";
  margin-right:6px;
  font-weight:950;
}

.calendar-panel{
  width:300px;
  padding:14px;
  border-radius:16px;
}
.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
  font-weight:900;
}
.calendar-head button{
  -webkit-appearance:none;
  appearance:none;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.calendar-weekday{
  text-align:center;
  font-size:10px;
  color:var(--muted);
  padding:3px;
}
.calendar-day{
  height:34px;
  border-radius:9px;
  -webkit-appearance:none;
  appearance:none;
  font-size:11px;
  font-weight:800;
  position:relative;
}
.calendar-day.today:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:2px;
  transform:translateX(-50%);
  width:5px;
  height:5px;
  border-radius:50%;
}

.calendar-empty{
  height:34px;
}

.notice{
  margin-top:20px;
  padding:15px 17px;
  border-radius:17px;
  font-size:12.5px;
  line-height:1.65;
}
.hidden{
  display:none !important;
}
.footer{
  margin-top:22px;
  text-align:center;
  font-size:11px;
  line-height:1.7;
}

.footer p{
  margin:3px 0;
}

@media(min-width:1101px){
  .hero{grid-template-columns:minmax(0,2.1fr) minmax(290px,1fr)}
  .today-card{padding:22px 24px}
  .today-card h2{font-size:22px;line-height:1.35}
}

@media(min-width:1250px){
  .day-card.single-date-card .floor-section .menu-list{
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:start;
  }
  .day-card.single-date-card .floor-section .menu-list:has(.menu-box:nth-child(3)){
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .day-card.single-date-card .floor-section .menu-list:has(.floor-empty){
    grid-template-columns:1fr;
  }
  .day-layout.single-floor{grid-template-columns:minmax(0,min(900px,100%))}
}

@media(min-width:901px){
  .wrap{width:min(1400px,calc(100% - 96px))}
  .mobile-date-bar{
    width:fit-content;
    max-width:100%;
    grid-template-columns:repeat(5,minmax(96px,112px));
    padding-left:0;
    padding-right:0;
  }

  /* 주간 보기: 헤더 / 20층 / 10층을 공통 행으로 맞춰
     요일마다 20층 메뉴 높이가 달라도 10층 시작선이 동일하게 보이도록 한다. */
  .week-grid.week-view{
    display:grid;
    grid-template-columns:repeat(5,minmax(240px,1fr));
    grid-template-rows:auto auto auto;
    gap:16px;
    align-items:stretch;
    overflow-x:auto;
  }
  .week-grid.week-view .day-card{
    min-width:240px;
    grid-row:span 3;
    display:grid;
    grid-template-rows:subgrid;
  }
  .week-grid.week-view .day-layout{display:contents}
  .week-grid.week-view .empty-menu-panel{grid-row:span 2}
  .week-grid.week-view .day-card:hover{transform:none;box-shadow:var(--shadow-hover)}
}

/* subgrid 미지원 브라우저에서는 기존 주간 카드 흐름을 유지한다. */
@supports not (grid-template-rows:subgrid){
  @media(min-width:901px){
    .week-grid.week-view{grid-template-rows:none}
    .week-grid.week-view .day-card{grid-row:auto;display:block}
    .week-grid.week-view .day-layout{display:block}
  }
}

@media(max-width:1100px){
  .hero{grid-template-columns:1fr}
  .today-card{display:none}
  .hero-mobile-content{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .hero-text{flex:1;min-width:0}
  .hero-mobile-character{
    display:block;
    width:clamp(110px,14vw,150px);
    height:auto;flex:0 0 auto;
    object-fit:contain;
    align-self:center;
    pointer-events:none;user-select:none;
  }
  .day-layout{gap:14px}
  .day-card.single-date-card .floor-section{padding:15px}
}

@media(max-width:900px){
  .wrap{width:min(calc(100% - 22px),760px);padding-top:10px}
  .topbar{top:6px;padding:11px 13px}
  .brand{font-size:16px}
  .campus-label{display:none}
  .hero{margin-bottom:18px}
  .hero-copy{padding:21px 22px}
  .hero-mobile-content{gap:14px}
  .hero-mobile-character{
    width:clamp(86px,22vw,126px);
  }
  .hero h1{font-size:clamp(27px,7vw,34px);max-width:none;margin:15px 0 8px}
  .subtitle{font-size:13px;max-width:none}
  .date-navigator{padding-bottom:12px}
  .mobile-date-bar{gap:6px}
  .week-view-button{display:none}
  .empty-menu-panel{min-height:200px;font-size:15px}
  .week-grid{touch-action:pan-y}
  .week-grid.is-swiping{position:relative;overflow:hidden}
  .week-grid.is-swiping > *{
    pointer-events:none;will-change:transform;
    backface-visibility:hidden;transform:translateZ(0);
  }
  .week-grid.is-swiping > .swipe-incoming{
    position:absolute;top:4px;left:1px;right:1px;
  }
}

@media(max-width:760px){
  .day-layout{grid-template-columns:1fr}
  .date-navigator{gap:8px}
  .mobile-date-bar{
    width:100%;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    padding-left:0;
    padding-right:0;
  }
  .mobile-day{min-width:0;padding:8px 3px}
}

@media(max-width:620px){
  .wrap{width:calc(100% - 40px);padding-top:10px}
  .date-navigator{padding-bottom:10px}
}

@media(max-width:520px){
  .hero-copy{padding:20px 19px}
  .hero-mobile-content{gap:10px}
  .hero h1{font-size:clamp(24px,7vw,30px);margin:14px 0 7px}
  .hero-mobile-character{width:clamp(78px,23vw,104px)}
  .day-card{border-radius:21px}
  .date-navigator{padding:9px 10px 10px}
  .nav-arrow{width:34px;height:34px}
  .day-card.single-date-card .day-head{margin-bottom:10px}
  .calendar-panel{width:min(290px,calc(100vw - 54px))}
  .day-head{gap:10px}
  .floor-btn{width:52px;min-width:52px;height:32px;padding:0 6px;font-size:11px}
}

@media(max-width:420px){
  .wrap{width:calc(100% - 34px)}
}

/* ===== Olive & Plum Theme ===== */
:root{
  --olive:#8F9A62;
  --olive-deep:#6E7848;
  --olive-soft:#E7E8D1;
  --plum:#7E355F;
  --plum-deep:#5E2747;
  --plum-soft:#EBDCE6;
  --cream:#F7F5EF;
  --paper:#FFFDF9;
  --text:#37332F;
  --muted:#746F69;
  --line:#E2DDD4;
  --floor20:#7E355F;
  --floor10:#8F9A62;
  --shadow:0 11px 28px rgba(70,59,51,.085);
  --shadow-hover:0 15px 34px rgba(70,59,51,.13);
}

body{
  background:
    radial-gradient(circle at 9% 7%,rgba(143,154,98,.15),transparent 28%),
    radial-gradient(circle at 92% 3%,rgba(143,154,98,.08),transparent 24%),
    linear-gradient(180deg,#F8F7F1 0%,#F4F2EA 100%);
}

.topbar{
  position:sticky;
  border-radius:24px;
  overflow:hidden;
  background:rgba(255,255,255,.68);
  border:1px solid rgba(255,255,255,.68);
  box-shadow:0 12px 34px rgba(67,58,49,.08);
  backdrop-filter:blur(18px) saturate(115%);
  -webkit-backdrop-filter:blur(18px) saturate(115%);
}
.brand{color:#4A443F}
.mini-nav{color:#5E5852}

.hero-copy,
.today-card,
.day-card,
.empty-menu-panel,
.calendar-panel,
.notice{
  background:rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 13px 34px rgba(67,58,49,.07);
  backdrop-filter:blur(18px) saturate(110%);
  -webkit-backdrop-filter:blur(18px) saturate(110%);
}

.hero-copy,.today-card{border-radius:26px}
.subtitle{color:#736D66}
.today-badge{color:#6F254D;background:#F4DCE9}

.date-navigator{
  border-radius:22px;
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 12px 34px rgba(67,58,49,.07);
  backdrop-filter:blur(16px) saturate(110%);
  -webkit-backdrop-filter:blur(16px) saturate(110%);
}
.nav-arrow,
.calendar-button,
.week-view-button{
  background:rgba(255,255,255,.68);
  color:#5F5953;
  box-shadow:inset 0 0 0 1px rgba(122,111,100,.10);
}
.week-view-button.active,
.floor-btn.active[data-floor="20"]{background:var(--plum);color:#fff;box-shadow:none}
.floor-btn.active[data-floor="10"]{background:var(--olive-deep);color:#fff;box-shadow:none}
.floor-btn.active[data-floor="all"]{background:#817B74;color:#fff;box-shadow:none}

.mobile-day{
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.72);
  color:#756F68;
  box-shadow:0 6px 16px rgba(67,58,49,.045);
  border-radius:15px;
}
.mobile-day.active{background:#F1E2EA;border-color:#D7B4C7;color:var(--plum-deep);box-shadow:0 6px 16px rgba(94,39,71,.09)}
.mobile-day.today:after{background:var(--plum)}

.day-head{
  background:rgba(255,255,255,.56);
  border-bottom:1px solid rgba(122,111,100,.10);
}
.day-head .weekday{color:#77716A}
.day-card.today-week-card{border-color:rgba(126,53,95,.38);box-shadow:0 13px 32px rgba(94,39,71,.10)}
.day-card.today-week-card .day-head{background:linear-gradient(90deg,rgba(244,220,233,.72),rgba(255,255,255,.45))}
.floor-btn{background:#F2EFE9;color:#6E6862}
.floor-badge.floor20{background:#F2E0E9;color:#672B4D}
.floor-badge.floor10{background:#E5E8D4;color:#58613B}

.menu-box{
  background:rgba(255,255,255,.72);
  border-radius:16px;
  box-shadow:0 7px 18px rgba(67,58,49,.045);
}
.type{color:#5E5852;background:#EEEAE4}
.type.korean{background:#F5E6C9;color:#7B5B26}
.type.noodle{background:#F4DCD0;color:#8B4F39}
.type.special{background:#E7D9EA;color:#744C79}
.type.western{background:#E0E6F2;color:#536987}
.type.salad{background:#DDE9D7;color:#4E6F47}
.type.etc{background:#E8E4DF;color:#68605A}
.items{color:#625D57;background:rgba(255,255,255,.58);border-radius:12px;padding:10px 11px}
.menu-box.main20 .items li::before{color:var(--plum)}
.menu-box.main10 .items li::before{color:var(--olive-deep)}

.calendar-panel{background:rgba(255,255,255,.92);border:1px solid rgba(122,111,100,.12);box-shadow:0 16px 38px rgba(67,58,49,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.calendar-day{background:#F4F1EB;color:#5F5953}
.calendar-day.selected{background:var(--plum);color:#fff}
.calendar-day.today:after{background:var(--plum)}
.calendar-head button{background:#F2EFE9;color:#615B55}

.notice{color:#746E67;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.70)}
.footer{color:#837D76}

@media(max-width:900px){
  .topbar{border-radius:18px}
  .hero-copy{border-radius:22px}
  .date-navigator{border-radius:18px}
  .mobile-day{border-radius:13px}
  .day-card{border-radius:20px}
  .menu-box{border-radius:14px}
}

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">싸밥서울</div>
    <nav class="mini-nav">
      <span class="campus-label">SSAFY 서울캠퍼스</span>
      <a class="info-link" href="https://app.notion.com/p/3baf2e21a8d58184808cc1b0fef38ff6?source=copy_link" target="_blank" rel="noopener noreferrer" aria-label="싸밥서울 소개">ⓘ</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <div class="hero-mobile-content">
        <div class="hero-text">
          <div class="today-badge">SSAFY SEOUL MENU</div>
          <h1>오늘의 식단을 한 눈에 확인하세요.</h1>
          <p class="subtitle">10층과 20층 식당의 메뉴를 빠르게 확인할 수 있습니다.</p>
        </div>
        <img src="./character.png" alt="" class="hero-mobile-character" />
      </div>
    </div>
    <div class="today-card">
      <div class="today-content">
        <div class="today-badge">TODAY</div>
        <h2 id="todayDate">오늘 날짜</h2>
        <p class="subtitle" id="todayMessage">오늘의 메뉴를 확인해보세요.</p>
      </div>
      <img src="./character.png" alt="" class="today-character" />
    </div>
  </section>

  <section class="date-controls">
    <div class="date-navigator">
      <button class="nav-arrow" id="prevWeek" type="button" aria-label="이전 주"><span>‹</span></button>
      <div class="date-center">
        <strong id="weekLabel"></strong>
        <button class="calendar-button" id="calendarButton" type="button" aria-label="달력 열기">📅</button>
        <button class="week-view-button" id="weekViewButton" type="button">주간 메뉴</button>
      </div>
      <button class="nav-arrow" id="nextWeek" type="button" aria-label="다음 주"><span>›</span></button>
      <div class="mobile-date-bar" id="mobileDateBar"></div>
    </div>
    <div class="calendar-panel hidden" id="calendarPanel"></div>
  </section>

  <main class="week-grid" id="weekGrid"></main>

  <div class="notice">
    메뉴 정보는 식당 사정에 따라 변경될 수 있습니다.
  </div>

  <footer class="footer">
    <p>식단 정보 출처: SSAFY 서울캠퍼스 구내식당 주간 식단표</p>
    <p>본 페이지는 구성원 편의를 위해 식단 정보를 재구성한 비공식 페이지이며 SSAFY 공식 서비스가 아닙니다.</p>
  </footer>
</div>

<script>
const dayNames=['일','월','화','수','목','금','토'];
const dayCodes=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const dayCache=new Map();
const pendingDays=new Map();
const mobileMedia=window.matchMedia('(max-width: 900px)');
let selectedFloor='all';
let selectedDate='';
let currentMonday=null;
let desktopWeekView=!mobileMedia.matches;
let calendarDate=null;
let isSwipeAnimating=false;
let renderSequence=0;

function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseKey(key){
  const [y,m,d]=key.split('-').map(Number);
  const x=new Date(y,m-1,d);
  x.setHours(12,0,0,0);
  return x;
}
function mondayOf(d){
  const x=new Date(d);
  const day=x.getDay();
  x.setDate(x.getDate()+(day===0?-6:1-day));
  x.setHours(12,0,0,0);
  return x;
}
function addDays(d,n){
  const x=new Date(d);
  x.setDate(x.getDate()+n);
  x.setHours(12,0,0,0);
  return x;
}
function sameDay(a,b){return dateKey(a)===dateKey(b)}
function escapeHTML(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
function getTypeClass(type){
  const t=String(type||'').toLowerCase();
  if(t.includes('한식'))return 'korean';
  if(t.includes('면')||t.includes('누들'))return 'noodle';
  if(t.includes('특식')||t.includes('일품'))return 'special';
  if(t.includes('양식'))return 'western';
  if(t.includes('샐러드'))return 'salad';
  return 'etc';
}

async function loadDay(key){
  if(dayCache.has(key))return dayCache.get(key);
  if(pendingDays.has(key))return pendingDays.get(key);

  const request=fetch(`./data/${key}.json`,{cache:'no-store'})
    .then(async res=>{
      if(!res.ok){
        if(res.status===404)return null;
        throw new Error(`HTTP ${res.status}`);
      }
      const data=await res.json();
      const floors=data&&data.floors&&typeof data.floors==='object'?data.floors:{};
      return {
        date:data?.date||key,
        dayCode:data?.dayCode||dayCodes[parseKey(key).getDay()],
        dateLabel:data?.dateLabel||`${parseKey(key).getMonth()+1}/${parseKey(key).getDate()}`,
        weekdayLabel:data?.weekdayLabel||`${dayNames[parseKey(key).getDay()]}요일`,
        floors:{
          '10':Array.isArray(floors['10'])?floors['10']:[],
          '20':Array.isArray(floors['20'])?floors['20']:[]
        }
      };
    })
    .catch(err=>{
      console.error(`[싸밥서울] ${key} 식단 로딩 실패`,err);
      return null;
    })
    .finally(()=>pendingDays.delete(key));

  pendingDays.set(key,request);
  const result=await request;
  dayCache.set(key,result);
  return result;
}

function menuBox(menu,floor){
  const [name,type,items]=Array.isArray(menu)?menu:['','',[]];
  const safeItems=Array.isArray(items)?items:[];
  return `
    <article class="menu-box main${floor}">
      <div class="menu-name">
        <span>${escapeHTML(name)}</span>
        <span class="type ${getTypeClass(type)}">${escapeHTML(type||'기타')}</span>
      </div>
      <ul class="items">
        ${safeItems.map(item=>`<li>${escapeHTML(item)}</li>`).join('')}
      </ul>
    </article>`;
}

function floorSection(floor,menus){
  const menuHTML=menus.length
    ?menus.map(menu=>menuBox(menu,floor)).join('')
    :'<div class="floor-empty">등록된 식단 정보가 없습니다.</div>';
  return `
    <section class="floor-section">
      <div class="floor-title">
        <h2>${floor}층 식당</h2>
        <span class="floor-badge floor${floor}">${floor}F</span>
      </div>
      <div class="menu-list">${menuHTML}</div>
    </section>`;
}

function dayCard(data,key,{single=false}={}){
  const d=parseKey(key);
  const today=sameDay(d,new Date());
  const floor20=data?.floors?.['20']||[];
  const floor10=data?.floors?.['10']||[];
  const hasAny=floor20.length||floor10.length;
  const buttons=`
    <div class="floor-buttons">
      <button class="floor-btn ${selectedFloor==='all'?'active':''}" data-floor="all" type="button">전체</button>
      <button class="floor-btn ${selectedFloor==='20'?'active':''}" data-floor="20" type="button">20층</button>
      <button class="floor-btn ${selectedFloor==='10'?'active':''}" data-floor="10" type="button">10층</button>
    </div>`;

  let content='';
  if(!hasAny){
    content='<div class="empty-menu-panel">등록된 식단이 없습니다.</div>';
  }else{
    const sections=[];
    if(selectedFloor==='all'||selectedFloor==='20')sections.push(floorSection('20',floor20));
    if(selectedFloor==='all'||selectedFloor==='10')sections.push(floorSection('10',floor10));
    content=`<div class="day-layout ${sections.length===1?'single-floor':''}">${sections.join('')}</div>`;
  }

  return `
    <article class="day-card ${single?'single-date-card':''} ${today?'today-week-card':''}" data-date="${key}">
      <div class="day-head">
        <div>
          <span class="date">${escapeHTML(data?.dateLabel||`${d.getMonth()+1}/${d.getDate()}`)}</span>
          <span class="weekday">${escapeHTML(data?.weekdayLabel||`${dayNames[d.getDay()]}요일`)}</span>
        </div>
        ${buttons}
      </div>
      ${content}
    </article>`;
}

function updateTodayCard(){
  const now=new Date();
  document.getElementById('todayDate').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${dayNames[now.getDay()]}요일`;
}

function renderDateButtons(){
  const bar=document.getElementById('mobileDateBar');
  const today=new Date();
  bar.innerHTML='';
  for(let i=0;i<5;i++){
    const d=addDays(currentMonday,i);
    const key=dateKey(d);
    const btn=document.createElement('button');
    btn.type='button';
    btn.className=`mobile-day ${key===selectedDate?'active':''} ${sameDay(d,today)?'today':''}`;
    btn.dataset.date=key;
    btn.innerHTML=`<span>${dayNames[d.getDay()]}</span><span class="num">${d.getDate()}</span>`;
    bar.appendChild(btn);
  }
}

function updateWeekLabel(){
  const end=addDays(currentMonday,4);
  const sameMonth=currentMonday.getMonth()===end.getMonth();
  document.getElementById('weekLabel').textContent=sameMonth
    ?`${currentMonday.getFullYear()}년 ${currentMonday.getMonth()+1}월`
    :`${currentMonday.getMonth()+1}월 - ${end.getMonth()+1}월`;
  document.getElementById('weekViewButton').classList.toggle('active',desktopWeekView&&!mobileMedia.matches);
}

async function render(){
  const sequence=++renderSequence;
  renderDateButtons();
  updateWeekLabel();
  const grid=document.getElementById('weekGrid');
  const weekMode=desktopWeekView&&!mobileMedia.matches;
  grid.classList.toggle('week-view',weekMode);

  const dates=weekMode
    ?Array.from({length:5},(_,i)=>dateKey(addDays(currentMonday,i)))
    :[selectedDate];
  const data=await Promise.all(dates.map(loadDay));
  if(sequence!==renderSequence)return;
  grid.innerHTML=dates.map((key,i)=>dayCard(data[i],key,{single:!weekMode})).join('');
}

function setSelectedDate(key,{keepWeekMode=false}={}){
  selectedDate=key;
  currentMonday=mondayOf(parseKey(key));
  if(!keepWeekMode)desktopWeekView=false;
  render();
}

function moveWeek(amount){
  currentMonday=addDays(currentMonday,amount*7);
  if(desktopWeekView&&!mobileMedia.matches){
    selectedDate=dateKey(currentMonday);
  }else{
    const selectedDay=parseKey(selectedDate).getDay();
    const offset=selectedDay===0?0:Math.max(0,Math.min(4,selectedDay-1));
    selectedDate=dateKey(addDays(currentMonday,offset));
  }
  render();
}

function renderCalendar(){
  const panel=document.getElementById('calendarPanel');
  if(!calendarDate)calendarDate=parseKey(selectedDate);
  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const selected=parseKey(selectedDate);
  let html=`
    <div class="calendar-head">
      <button type="button" data-cal-nav="-1">‹</button>
      <span>${y}년 ${m+1}월</span>
      <div>
        <button type="button" data-cal-today aria-label="오늘로 이동">↻</button>
        <button type="button" data-cal-nav="1">›</button>
      </div>
    </div>
    <div class="calendar-grid">`;
  ['일','월','화','수','목','금','토'].forEach(d=>html+=`<div class="calendar-weekday">${d}</div>`);
  for(let i=0;i<first.getDay();i++)html+='<div class="calendar-empty"></div>';
  for(let day=1;day<=last.getDate();day++){
    const d=new Date(y,m,day);
    const key=dateKey(d);
    html+=`<button type="button" class="calendar-day ${sameDay(d,new Date())?'today':''} ${sameDay(d,selected)?'selected':''}" data-cal-date="${key}">${day}</button>`;
  }
  html+='</div>';
  panel.innerHTML=html;
}

function openCalendar(){
  calendarDate=parseKey(selectedDate);
  renderCalendar();
  document.getElementById('calendarPanel').classList.remove('hidden');
}
function closeCalendar(){document.getElementById('calendarPanel').classList.add('hidden')}

function bindEvents(){
  document.getElementById('prevWeek').addEventListener('click',()=>moveWeek(-1));
  document.getElementById('nextWeek').addEventListener('click',()=>moveWeek(1));
  document.getElementById('weekViewButton').addEventListener('click',()=>{
    if(mobileMedia.matches)return;
    desktopWeekView=true;
    currentMonday=mondayOf(parseKey(selectedDate));
    render();
  });
  document.getElementById('mobileDateBar').addEventListener('click',e=>{
    const btn=e.target.closest('[data-date]');
    if(btn)setSelectedDate(btn.dataset.date);
  });
  document.getElementById('weekGrid').addEventListener('click',e=>{
    const btn=e.target.closest('.floor-btn');
    if(!btn)return;
    selectedFloor=btn.dataset.floor;
    render();
  });
  document.getElementById('calendarButton').addEventListener('click',e=>{
    e.stopPropagation();
    const panel=document.getElementById('calendarPanel');
    panel.classList.contains('hidden')?openCalendar():closeCalendar();
  });
  document.getElementById('calendarPanel').addEventListener('click',e=>{
    e.stopPropagation();
    const nav=e.target.closest('[data-cal-nav]');
    if(nav){calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+Number(nav.dataset.calNav),1);renderCalendar();return}
    if(e.target.closest('[data-cal-today]')){calendarDate=new Date();setSelectedDate(dateKey(new Date()));renderCalendar();return}
    const day=e.target.closest('[data-cal-date]');
    if(day){setSelectedDate(day.dataset.calDate);calendarDate=parseKey(day.dataset.calDate);renderCalendar()}
  });
  document.addEventListener('click',e=>{
    const panel=document.getElementById('calendarPanel');
    const button=document.getElementById('calendarButton');
    if(!panel.contains(e.target)&&!button.contains(e.target))closeCalendar();
  });

  let startX=0,startY=0;
  const grid=document.getElementById('weekGrid');
  grid.addEventListener('touchstart',e=>{
    if(!mobileMedia.matches||e.touches.length!==1||isSwipeAnimating)return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  },{passive:true});
  grid.addEventListener('touchend',async e=>{
    if(!mobileMedia.matches||isSwipeAnimating||!startX||!e.changedTouches.length)return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    startX=0;startY=0;
    if(Math.abs(dx)<55||Math.abs(dx)<=Math.abs(dy))return;
    isSwipeAnimating=true;
    const direction=dx<0?1:-1;
    const current=grid.firstElementChild;
    const nextDate=addDays(parseKey(selectedDate),direction);
    const nextKey=dateKey(nextDate);
    const nextData=await loadDay(nextKey);
    if(!current){selectedDate=nextKey;currentMonday=mondayOf(nextDate);isSwipeAnimating=false;render();return}
    const incoming=document.createElement('div');
    incoming.className='swipe-incoming';
    incoming.innerHTML=dayCard(nextData,nextKey,{single:true});
    grid.classList.add('is-swiping');
    grid.appendChild(incoming);
    const width=grid.getBoundingClientRect().width;
    current.style.transition='none';incoming.style.transition='none';
    current.style.transform='translateX(0)';
    incoming.style.transform=`translateX(${direction*width}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      current.style.transition='transform .26s ease';
      incoming.style.transition='transform .26s ease';
      current.style.transform=`translateX(${-direction*width}px)`;
      incoming.style.transform='translateX(0)';
    }));
    await new Promise(resolve=>setTimeout(resolve,280));
    selectedDate=nextKey;
    currentMonday=mondayOf(nextDate);
    grid.classList.remove('is-swiping');
    isSwipeAnimating=false;
    render();
  },{passive:true});

  mobileMedia.addEventListener('change',()=>{
    if(mobileMedia.matches)desktopWeekView=false;
    currentMonday=mondayOf(parseKey(selectedDate));
    render();
  });
}

(function init(){
  const today=new Date();
  selectedDate=dateKey(today);
  currentMonday=mondayOf(today);
  updateTodayCard();
  bindEvents();
  render();
})();
</script>
</body>
</html>
