let currentDay='all',currentFloor='all';
function applyFilters(){document.querySelectorAll('.day-card').forEach(c=>c.classList.toggle('hidden',currentDay!=='all'&&c.dataset.day!==currentDay));document.querySelectorAll('.floor-section').forEach(s=>s.classList.toggle('hidden',currentFloor!=='all'&&s.dataset.floor!==currentFloor))}
document.querySelectorAll('.date-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.date-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentDay=b.dataset.day;applyFilters()}));document.querySelectorAll('.floor-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.floor-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFloor=b.dataset.floor;applyFilters()}));weekSelect.addEventListener('change',render);render();
</script>
</body>
</html>
